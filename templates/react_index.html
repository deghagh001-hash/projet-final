<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube to MP4 - React Version</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Development Version for debugging) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX transformation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Spinner for loading state */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    
    <!-- Error Display (Hidden by default) -->
    <div id="error-display" style="display: none; position: fixed; top: 0; left: 0; width: 100%; z-index: 99999; background: #ef4444; color: white; padding: 20px; font-family: monospace; white-space: pre-wrap; border-bottom: 2px solid white;"></div>

    <script>
        // Global Error Handler to show errors on screen
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errorDiv = document.getElementById('error-display');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `<strong>⚠️ Error Detected:</strong>\n${msg}\n\nLocation: ${url}:${lineNo}:${columnNo}\n\n${error ? error.stack : ''}`;
            return false;
        };
        
        // Catch Promise errors (like fetch failures)
        window.addEventListener('unhandledrejection', function(event) {
            const errorDiv = document.getElementById('error-display');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML += `\n\n<strong>⚠️ Unhandled Promise Rejection:</strong>\n${event.reason}`;
        });
    </script>

    <!-- Background Video -->
    <video autoplay muted loop playsinline id="bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -2; object-fit: cover; opacity: 0.4;">
        <source src="{{ url_for('static', filename='video/background.mp4') }}" type="video/mp4">
    </video>
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 10, 0.8); z-index: -1;"></div>

    <!-- REACT ROOT -->
    <div id="root" class="flex items-center justify-center min-h-screen">
        <div class="text-center">
            <div class="spinner mx-auto mb-4"></div>
            <p class="text-xl font-mono animate-pulse">Loading React Application...</p>
        </div>
    </div>

    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Modules partagés (Easter Eggs, client de conversion, quota quotidien) -->
    <script type="module" src="{{ url_for('static', filename='js/shared/easter-eggs.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/shared/convert-client.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/shared/daily-limit.js') }}"></script>

    <!-- Main React Application Code (source unique : static/js/react_app.jsx) -->
    <script type="text/babel" src="{{ url_for('static', filename='js/react_app.jsx') }}"></script>
</body>
</html>
